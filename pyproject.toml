# Generated by `insights new-app`. Managed with uv.
#
#   uv sync          install (creates .venv, writes uv.lock)
#   uv run insights doctor
#   uv run insights up
#
# The lockfile IS committed. Two apps on the same SDK floor must resolve to the
# same versions, or "works on my machine" becomes the platform team's problem.
[project]
name = "comp-report"
version = "0.1.0"
description = "Weekly compensation equity summary. A scheduled job on Insights Hub."
requires-python = ">=3.12"

dependencies = [
  # The only platform dependency. A FLOOR, not a pin - see ADR-001.
  # Must match runtime.sdk in app.yaml; CI fails if they disagree.
  "insights-sdk>=0.1,<1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false          # an app, not a library - nothing to publish

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv.sources]
# LOCAL DEVELOPMENT ONLY. During development the four repos sit side by side, and this
# app should build against the SDK in the checkout next to it rather than the last
# published release - otherwise you cannot test an SDK change without publishing it.
#
# In a real registry-backed environment this block is removed and the version range in
# [project.dependencies] does the work. That range is the actual contract; this is a
# development convenience (ADR-001).
insights-sdk = { path = "../insights-sdk", editable = true }
