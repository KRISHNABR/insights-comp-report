# Generated by `insights new-app`. Managed with uv.
#
#   uv sync          install (creates .venv, writes uv.lock)
#   uv run insights doctor
#   uv run insights up
#
# The lockfile IS committed. Two apps on the same SDK floor must resolve to the
# same versions, or "works on my machine" becomes the platform team's problem.
[project]
name = "comp-report"
version = "0.1.0"
description = "Weekly compensation equity summary. A scheduled job on Insights Hub."
requires-python = ">=3.12"

dependencies = [
  # The only platform dependency. A FLOOR, not a pin - see ADR-001.
  # Must match runtime.sdk in app.yaml; CI fails if they disagree.
  "insights-sdk>=0.1,<1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false          # an app, not a library - nothing to publish

[tool.pytest.ini_options]
pythonpath = ["src"]

# ---------------------------------------------------------------------------
# WHERE THE SDK COMES FROM
#
# The version range above is the CONTRACT - a floor, not a pin (ADR-001). This
# block only says where to FETCH a version satisfying it.
#
# In an organisation with an internal package index this block is DELETED, and
# the index is configured once for everyone:
#
#     [[tool.uv.index]]
#     name = "internal"
#     url  = "https://artifacts.corp.example/simple"
#
# This submission has no index, so the git tag stands in for one. `v1` is a
# MOVING major tag: re-locking picks up patches and minors, and a breaking change
# means cutting v2 rather than moving it. Same argument as the version floor, and
# the same as the reusable workflow's @v1.
#
# It must NOT be a local path. A tenant clones only their own repo, so a path
# source resolves on the platform team's machine and nowhere else.
# ---------------------------------------------------------------------------
[tool.uv.sources]
insights-sdk = { git = "https://github.com/KRISHNABR/insights-sdk.git", tag = "v1" }
